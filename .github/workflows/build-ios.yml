name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: i686-unknown-linux-musl
        override: true
    
    - name: Install musl-tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools musl-dev gcc-multilib
    
    - name: Build
      env:
        CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        CC_i686_unknown_linux_musl: musl-gcc
        CFLAGS_i686_unknown_linux_musl: -m32
      run: cargo build --release --target i686-unknown-linux-musl