name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-arm64-musl
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            name: linux-i686-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CC: musl-gcc
      - name: Package
        run: |
          BIN=target/${{ matrix.target }}/release/webscope
          strip "$BIN" || true
          mkdir -p dist
          cp "$BIN" dist/webscope-${{ matrix.name }}
          (cd dist && sha256sum webscope-${{ matrix.name }} > SHA256SUMS-${{ matrix.name }})
          file dist/webscope-${{ matrix.name }} || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/webscope-${{ matrix.name }}
            dist/SHA256SUMS-${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
