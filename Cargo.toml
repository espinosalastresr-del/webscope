[package]
name = "webscope"
version = "0.1.0"
edition = "2021"
authors = ["WebScope Contributors"]
description = "CLI for autonomous web discovery, crawling, classification and incremental learning"
license = "MIT"
readme = "README.md"
repository = "https://github.com/webscope/webscope"
keywords = ["crawler", "discovery", "classification", "cli", "rust"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "cookies", "json", "stream"] }
ring = "=0.16.20"  # Versión anterior sin el bug de compilación
clap = { version = "4", features = ["derive", "env"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
futures = "0.3"
async-trait = "0.1"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
bytes = "1"
csv = "1"

# Para forzar que todas las dependencias usen ring 0.16.20
[patch.crates-io]
ring = { version = "=0.16.20" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[profile.dev]
opt-level = 1
